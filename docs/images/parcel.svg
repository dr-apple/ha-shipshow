<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 444" width="520" height="444" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<rect width="520" height="444" rx="16" fill="#ffffff" stroke="#e1e4e8"/>
<text x="24" y="40" font-size="21" font-weight="600" fill="#212121">AirTag 4-pack</text>
<text x="24" y="62" font-size="13" fill="#727272">ShipShow parcel device</text>
<circle cx="44" cy="104" r="17" fill="#ff9800" fill-opacity="0.14"/>
<text x="44" y="110" text-anchor="middle" font-size="16" fill="#ff9800">▣</text>
<text x="76" y="109" font-size="15.5" fill="#212121">Status</text>
<text x="496" y="109" text-anchor="end" font-size="15" fill="#424242">Out for delivery</text>
<circle cx="44" cy="156" r="17" fill="#44739e" fill-opacity="0.14"/>
<text x="44" y="162" text-anchor="middle" font-size="16" fill="#44739e">✉</text>
<text x="76" y="161" font-size="15.5" fill="#212121">Last update</text>
<text x="496" y="161" text-anchor="end" font-size="15" fill="#424242">Parcel is on its way</text>
<circle cx="44" cy="208" r="17" fill="#44739e" fill-opacity="0.14"/>
<text x="44" y="214" text-anchor="middle" font-size="16" fill="#44739e">◷</text>
<text x="76" y="213" font-size="15.5" fill="#212121">Planned delivery</text>
<text x="496" y="213" text-anchor="end" font-size="15" fill="#424242">Today 11:15–13:30</text>
<circle cx="44" cy="260" r="17" fill="#44739e" fill-opacity="0.14"/>
<text x="44" y="266" text-anchor="middle" font-size="16" fill="#44739e">⌛</text>
<text x="76" y="265" font-size="15.5" fill="#212121">Days until delivery</text>
<text x="496" y="265" text-anchor="end" font-size="15" fill="#424242">0</text>
<circle cx="44" cy="312" r="17" fill="#44739e" fill-opacity="0.14"/>
<text x="44" y="318" text-anchor="middle" font-size="16" fill="#44739e">⚑</text>
<text x="76" y="317" font-size="15.5" fill="#212121">Stops remaining</text>
<text x="496" y="317" text-anchor="end" font-size="15" fill="#424242">3</text>
<circle cx="44" cy="364" r="17" fill="#44739e" fill-opacity="0.14"/>
<text x="44" y="370" text-anchor="middle" font-size="16" fill="#44739e">✓</text>
<text x="76" y="369" font-size="15.5" fill="#212121">Delivered</text>
<text x="496" y="369" text-anchor="end" font-size="15" fill="#424242">Off</text>
<text x="260.0" y="426" text-anchor="middle" font-size="12" font-style="italic" fill="#9e9e9e">Illustration – example data</text>
</svg>